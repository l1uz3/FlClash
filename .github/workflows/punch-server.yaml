name: punch-server

# The coordinator and agent that the punch dialer talks to. Linux only: the agent needs tcpdump and
# iptables, and both sides are long-running services.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'punch-v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.4'

jobs:
  server:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l . >&2; exit 1; }

      - name: Vet and test
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Shell scripts
        working-directory: server/deploy
        run: |
          bash -n install.sh
          shellcheck -S warning install.sh fw-remove.example.sh

      # install.sh compares `punch version` with the release tag to decide whether to update.
      - name: Build
        run: |
          ver=dev
          case "$GITHUB_REF" in refs/tags/punch-v*) ver="${GITHUB_REF#refs/tags/}" ;; esac
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.version=$ver" -o dist/punch-server-linux-$arch .
          done
          cp deploy/* dist/
          (cd dist && sha256sum punch-server-linux-* > SHA256SUMS)
          test "$(./dist/punch-server-linux-amd64 version)" = "$ver"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: punch-server-linux
          path: server/dist/*
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/punch-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            server/dist/punch-server-linux-*
            server/dist/SHA256SUMS
            server/dist/install.sh
