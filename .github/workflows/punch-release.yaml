name: punch-release

# Creates the GitHub release for an app-v* tag before the package workflows finish. They all
# upload into the same release; if each created it on its own, two of them could race and leave
# two releases for one tag.
on:
  push:
    tags:
      - 'app-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The app compares its own version with the tag to decide whether to offer an update, so a
      # tag that disagrees with pubspec.yaml would offer it forever or never.
      - name: Tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          app="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1/p' pubspec.yaml)"
          test "app-v$app" = "$TAG" || { echo "::error::tag $TAG but pubspec.yaml says $app"; exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
