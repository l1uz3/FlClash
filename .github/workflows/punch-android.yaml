name: punch-android

# Signed Android build for this fork. The upstream build.yaml only packages on
# chen08209/FlClash tags, so it never produces an APK here.
on:
  workflow_dispatch:
  push:
    branches:
      - punch
    tags:
      - 'punch-v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.26.4'
  NDK_VERSION: r28c

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android signing
        env:
          KEYSTORE: ${{ secrets.PUNCH_KEYSTORE }}
          KEY_ALIAS: ${{ secrets.PUNCH_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.PUNCH_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PUNCH_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo 'PUNCH_KEYSTORE secret is missing' >&2; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --env stable -v

      - name: Verify signature
        env:
          # SHA-256 of the release certificate; a debug-signed APK must fail here.
          EXPECTED_CERT: 348c74fe360a1757f8883e366f8a2e64c36406a2403585839cce1b9401a1b642
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          test -x "$apksigner" || { echo "apksigner not found" >&2; exit 1; }
          for apk in dist/*.apk; do
            echo "== $apk"
            out=$("$apksigner" verify --verbose --print-certs "$apk" 2>&1) || { echo "$out"; exit 1; }
            echo "$out" | grep -iE 'Verified using|certificate (DN|SHA-256)' || true
            echo "$out" | tr -d ':' | tr 'A-F' 'a-f' | grep -q "$EXPECTED_CERT" \
              || { echo "::error::$apk is not signed with the release key"; echo "$out"; exit 1; }
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flclash-punch-android
          path: dist/*.apk
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/punch-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
