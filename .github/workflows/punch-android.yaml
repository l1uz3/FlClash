name: punch-android

# Signed Android build for this fork. The upstream build.yaml only packages on
# chen08209/FlClash tags, so it never produces an APK here.
# main only changes through pull requests, which build here first; pushes to main and
# app-v* tags then build the packages that get shipped.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'app-v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.26.4'
  NDK_VERSION: r28c

jobs:
  android:
    # Pull requests from other forks get no secrets, so they cannot sign; skip instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android signing
        env:
          KEYSTORE: ${{ secrets.PUNCH_KEYSTORE }}
          KEY_ALIAS: ${{ secrets.PUNCH_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.PUNCH_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PUNCH_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo 'PUNCH_KEYSTORE secret is missing' >&2; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --env stable -v

      - name: Verify signature
        env:
          # SHA-256 of the release certificate; a debug-signed APK must fail here.
          EXPECTED_CERT: 348c74fe360a1757f8883e366f8a2e64c36406a2403585839cce1b9401a1b642
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          test -x "$apksigner" || { echo "apksigner not found" >&2; exit 1; }
          for apk in dist/*.apk; do
            echo "== $apk"
            out=$("$apksigner" verify --verbose --print-certs "$apk" 2>&1) || { echo "$out"; exit 1; }
            echo "$out" | grep -iE 'Verified using|certificate (DN|SHA-256)' || true
            echo "$out" | tr -d ':' | tr 'A-F' 'a-f' | grep -q "$EXPECTED_CERT" \
              || { echo "::error::$apk is not signed with the release key"; echo "$out"; exit 1; }
          done

      # One artifact per ABI, so each APK downloads on its own instead of inside one zip.
      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: flclash-punch-android-arm64-v8a
          path: dist/*-arm64-v8a.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: flclash-punch-android-armeabi-v7a
          path: dist/*-armeabi-v7a.apk
          if-no-files-found: error

      - name: Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: flclash-punch-android-x86_64
          path: dist/*-x86_64.apk
          if-no-files-found: error

      # punch-release creates the release; uploading only avoids two workflows creating it at once.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for i in $(seq 1 30); do
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            sleep 10
          done
          shopt -s nullglob
          files=(dist/*.apk)
          test ${#files[@]} -gt 0 || { echo "::error::nothing to upload"; exit 1; }
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"
